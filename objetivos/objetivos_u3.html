<!-- LIBRERÍAS: GSAP + Fuentes Modernas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">

<style>
/* --- 1. ESTÉTICA "AURORA FLUIDA" --- */
:root {
    /* Fondos */
    --fluid-bg: #F4F6F9;                 /* Fondo fluido claro */
    --card-bg: #FFFFFF;                  /* Fondo de tarjetas */

    /* Glass y Bordes */
    --glass: rgba(255, 255, 255, 0.8);    /* Glass blanco */
    --border: rgba(254, 200, 47, 0.5);    /* Borde amarillo suave */

    /* Acentos Institucionales */
    --accent-pink: #D23B78;              /* Emoción / tensión */
    --accent-cyan: #480241;              /* Morado UNP (Principal) */
    --accent-purple: #FF9800;            /* Naranja (Secundario) */
    --accent-yellow: #FEC82F;            /* Amarillo (Detalles) */

    /* Textos */
    --text-main: #333333;                /* Texto oscuro */
    --text-muted: #555555;               /* Texto secundario */
}

#prism-container {
    width: 100%;
    min-height: 750px;
    height: auto;
    background-color: var(--fluid-bg);
    position: relative;
    overflow: hidden;
    font-family: 'Outfit', sans-serif;
    color: var(--text-main);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 40px rgba(0,0,0,0.05);
    border: 1px solid #e0e0e0;
}

/* Fondo Aurora Animado */
.aurora-blob {
    position: absolute;
    filter: blur(80px);
    opacity: 0.25; 
    border-radius: 50%;
    animation: floatAurora 12s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 0;
}
.blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: var(--accent-cyan); } 
.blob-2 { bottom: -10%; right: -10%; width: 40vw; height: 40vw; background: var(--accent-purple); animation-delay: -5s; } 
.blob-3 { top: 40%; left: 40%; width: 30vw; height: 30vw; background: var(--accent-pink); animation-duration: 15s; } 

@keyframes floatAurora {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(40px, -40px) scale(1.1); }
}

/* Grid de Ruido */
.noise-overlay {
    position: absolute; top:0; left:0; width:100%; height:100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    z-index: 1; pointer-events: none;
}

/* --- 2. INTERFAZ --- */
.prism-header {
    position: relative; z-index: 10;
    padding: 20px 30px;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #eee;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
}

.logos-container {
    display: flex; align-items: center; gap: 15px; margin-right: auto;
}
.client-logo {
    height: 115px; width: auto; object-fit: contain;
}

.title-group {
    display: flex; flex-direction: column; margin-left: auto;
}

.prism-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(1.2rem, 3vw, 1.6rem);
    color: var(--accent-cyan); 
    font-weight: 700;
    margin: 0;
}

/* --- CONTENIDO --- */
.prism-content {
    flex: 1; position: relative; z-index: 5;
    padding: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow-y: auto;
}

/* --- SIMULADOR (CHAT) --- */
.sim-container {
    width: 100%; max-width: 700px;
    background: #FFFFFF; border: 1px solid #ddd;
    border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column;
    height: 550px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

.chat-window {
    flex: 1; padding: 25px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 20px;
    background: #F9FAFB;
}
.chat-bubble {
    padding: 15px 20px; border-radius: 12px; max-width: 85%;
    font-size: 0.95rem; line-height: 1.5; 
    animation: popIn 0.3s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}
.bot {
    background: #FFFFFF; border-top-left-radius: 2px; align-self: flex-start;
    border-left: 4px solid var(--accent-cyan); color: var(--text-main);
}
.user-choice {
    background: #FFF3E0; 
    border-bottom-right-radius: 2px; align-self: flex-end;
    border-right: 4px solid var(--accent-purple); text-align: right;
    color: #444;
}

.controls-area {
    padding: 20px; background: #FFFFFF;
    border-top: 1px solid #eee;
    display: flex; flex-direction: column; gap: 10px;
}
.option-btn {
    padding: 15px; border-radius: 8px; border: 1px solid #ddd;
    background: #fff; color: var(--text-main); cursor: pointer;
    transition: 0.2s; text-align: left; font-size: 0.95rem; font-weight: 500;
}
.option-btn:hover { 
    background: #F3E5F5; 
    border-color: var(--accent-cyan); color: var(--accent-cyan); 
}

/* ANIMACIONES */
@keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* RESPONSIVE */
@media (max-width: 900px) {
    .prism-header { flex-direction: column; align-items: center; text-align: center; }
    .logos-container { width: 100%; justify-content: center; margin-bottom: 10px; margin-right: 0; }
    .title-group { margin-left: 0; }
}
@media (max-width: 600px) {
    .client-logo { height: 80px; }
    .prism-content { padding: 20px; }
}
</style>

<div id="prism-container">
    <div class="noise-overlay"></div>
    <!-- Blobs suaves -->
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
    <div class="aurora-blob blob-3"></div>

    <div class="prism-header">
        <div class="logos-container">
            <img src="../Styles/UNP I.svg" alt="Logo UNP" class="client-logo" style="height:130px; width:auto;">
            <img src="../Styles/logo.png" alt="Logo Comisión" class="client-logo" style="height:100px; width:auto;">
        </div>
        <div class="title-group">
            <h2 class="prism-title">Simulador: Identidades Diversas</h2>
        </div>
    </div>

    <div class="prism-content">
        <!-- SECCIÓN ÚNICA: SIMULADOR (CHAT) -->
        <div id="sec-sim" class="sim-container">
            <div class="chat-window" id="chat-feed">
                <div class="chat-bubble bot">
                    👋 <strong>Sistema de Práctica:</strong><br>
                    Bienvenido/a. Estás en la ventanilla de atención. Llega una persona con expresión de género femenina, pero su documento de identidad tiene nombre masculino ("Juan").<br><br>
                    ¿Cómo procedes?
                </div>
            </div>
            
            <div class="controls-area" id="sim-controls">
                <button class="option-btn" onclick="playTurn(1)">A. "Señor Juan, siga por aquí." (Usar dato del documento)</button>
                <button class="option-btn" onclick="playTurn(2)">B. "Buenos días, ¿cómo le gustaría ser llamada/o?" (Preguntar pronombre)</button>
            </div>
        </div>
    </div>
</div>

<script>
// --- LÓGICA DEL SIMULADOR (JUEGO DE ROLES) ---
let simStep = 0;

const simData = [
    { /* PASO 0 (INICIO) */ },
    {
        // PASO 1
        options: [
            {
                text: "A. Usar el nombre del documento sin preguntar.",
                correct: false,
                feedback: "⚠️ <strong>Error de Enfoque Diferencial:</strong> Llamar a una persona trans por su 'nombre muerto' (deadname) es revictimizante y viola el reconocimiento de su identidad.",
                nextStep: 2
            },
            {
                text: "B. Preguntar nombre identitario o pronombre.",
                correct: true,
                feedback: "✨ <strong>¡Correcto!</strong> Siempre se debe preguntar cómo prefiere ser tratada la persona, independientemente del documento. Esto garantiza el reconocimiento.",
                nextStep: 2
            }
        ]
    },
    {
        // PASO 2
        question: "La persona menciona que ha recibido amenazas por su identidad de género en su barrio. ¿Qué acción tomas?",
        options: [
            {
                text: "A. Registrarlo como 'problemas entre vecinos' (Generalizar).",
                correct: false,
                feedback: "⚠️ <strong>Incorrecto.</strong> Esto invisibiliza la violencia por prejuicio. Se debe identificar la violencia específica hacia identidades diversas.",
                nextStep: 3
            },
            {
                text: "B. Activar ruta de riesgo por discriminación/prejuicio.",
                correct: true,
                feedback: "✨ <strong>¡Muy bien!</strong> Identificar la violencia específica (crímenes por prejuicio) permite activar las medidas de protección adecuadas.",
                nextStep: 3
            }
        ]
    },
    {
        // PASO 3: FINAL
        question: "🎉 <strong>Simulación Finalizada.</strong><br>Has aplicado el reconocimiento institucional y el enfoque diferencial.",
        options: [] 
    }
];

function playTurn(optionIndex) {
    const chatFeed = document.getElementById('chat-feed');
    const controls = document.getElementById('sim-controls');
    
    // 1. Mostrar elección del usuario
    const userBubble = document.createElement('div');
    userBubble.className = 'chat-bubble user-choice';
    
    let currentStepData = simStep === 0 ? simData[1] : simData[simStep+1];
    
    // Safety check para evitar errores si el paso no existe
    if (!currentStepData || !currentStepData.options) return;

    let selectedText = optionIndex === 1 ? currentStepData.options[0].text : currentStepData.options[1].text;
    
    userBubble.innerHTML = "Tú: " + selectedText;
    chatFeed.appendChild(userBubble);

    // 2. Procesar lógica (Feedback)
    let choiceData = optionIndex === 1 ? currentStepData.options[0] : currentStepData.options[1];
    
    setTimeout(() => {
        const botBubble = document.createElement('div');
        botBubble.className = 'chat-bubble bot';
        botBubble.innerHTML = choiceData.feedback;
        
        // Estilos de borde según acierto/error
        if(choiceData.correct) botBubble.style.borderLeftColor = 'var(--accent-cyan)'; // Morado
        else botBubble.style.borderLeftColor = '#D32F2F'; // Rojo error
        
        chatFeed.appendChild(botBubble);
        chatFeed.scrollTop = chatFeed.scrollHeight;

        // 3. Siguiente Pregunta
        simStep++;
        if(simStep < simData.length - 1 && simStep < 2) { 
             setTimeout(() => {
                 const nextQ = document.createElement('div');
                 nextQ.className = 'chat-bubble bot';
                 nextQ.innerHTML = simData[simStep+1].question;
                 chatFeed.appendChild(nextQ);
                 chatFeed.scrollTop = chatFeed.scrollHeight;
                 
                 let nextOpts = simData[simStep+1].options;
                 controls.innerHTML = `
                    <button class="option-btn" onclick="playTurn(1)">${nextOpts[0].text}</button>
                    <button class="option-btn" onclick="playTurn(2)">${nextOpts[1].text}</button>
                 `;
             }, 1000);
        } else if (simStep >= 2) {
             // Fin
             setTimeout(() => {
                 const endMsg = document.createElement('div');
                 endMsg.className = 'chat-bubble bot';
                 endMsg.innerHTML = "Has completado la práctica de atención inclusiva.";
                 chatFeed.appendChild(endMsg);
                 chatFeed.scrollTop = chatFeed.scrollHeight;
                 controls.innerHTML = `<button class="option-btn" style="text-align:center;" onclick="location.reload()">Reiniciar Simulación</button>`;
             }, 1000);
        }

    }, 500);
}

// Animación inicial al cargar la página
gsap.fromTo("#sec-sim", {opacity: 0, y: 15}, {opacity: 1, y: 0, duration: 0.6});
</script>
